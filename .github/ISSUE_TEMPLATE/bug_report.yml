name: Bug report
description: Help improve tiling, the panel or search.
body:
  - type: textarea
    id: environment
    attributes:
      label: Desktop environment
      description: GNOME Shell and NexTile versions, distribution, Wayland/X11, monitors and related extensions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant errors or screenshots
      description: Optional. Remove private information before posting.
